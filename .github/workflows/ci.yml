# CI: lint, format check and tests on every PR and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI only needs to read the code.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Get the repo's code onto the runner.
      - uses: actions/checkout@v5

      # Same Python as local dev; cache pip downloads keyed on both requirements files.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      # App deps + pytest + ruff (pinned versions).
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Lint rules from pyproject.toml.
      - name: Ruff lint
        run: ruff check .

      # Fail if any file isn't formatted (doesn't change files).
      - name: Ruff format check
        run: ruff format --check .

      # Tests fake st.secrets, so no secrets.toml or olist.db is needed.
      - name: Tests
        run: pytest
